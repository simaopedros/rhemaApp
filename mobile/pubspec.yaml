name: rhema_app
description: "RHEMA - Plataforma Social de Vídeos Cristãos"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Navegação
  go_router: ^14.6.0
  
  # Gerenciamento de Estado
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Networking
  dio: ^5.4.0
  
  # Autenticação Google
  google_sign_in: ^6.2.1
  
  # Storage Local
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Vídeo Player
  video_player: ^2.8.2
  chewie: ^1.7.5
  
  # UI Components
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  lottie: ^3.1.2
  
  # Formulários
  flutter_form_builder: ^9.2.1
  form_builder_validators: ^10.0.1
  
  # Permissões e Arquivos
  permission_handler: ^11.3.0
  image_picker: ^1.0.7
  file_picker: ^8.0.3
  
  # Utilitários
  intl: ^0.19.0
  url_launcher: ^6.2.4
  share_plus: ^8.0.2
  
  # Animações
  flutter_animate: ^4.5.0
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0

dependency_overrides:
  package_info_plus: ^8.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/

